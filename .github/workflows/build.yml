# Builds, tests, measures coverage and packs on every pull request and every push to master, so a
# change is verified by the same steps the release runs before anyone merges it. Nothing is
# published here; that is publish.yml, which runs on a release.
name: Build and test
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    # Matches publish.yml and where the suite is verified locally. The tests pin the culture to
    # en-US, but Linux resolves those formats through ICU rather than Windows NLS.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FlatFiles.sln --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test FlatFiles.sln --configuration Release --no-build

      - name: Measure coverage
        # The bar the pull request template asks for, on lines and on branches. dotnet-coverage is
        # Microsoft's collector, installed as a tool with nothing added to the test project; it wraps
        # the test run and writes a Cobertura report whose root carries both rates.
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage collect -f cobertura -o coverage.xml --include-files "**/FlatFiles.dll" -- dotnet test FlatFiles.Test --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "dotnet-coverage failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path coverage.xml)) { throw 'dotnet-coverage produced no coverage.xml.' }
          $root = ([xml] (Get-Content coverage.xml -Raw)).coverage
          $lines = [math]::Round(100 * [double] $root.'line-rate')
          $branches = [math]::Round(100 * [double] $root.'branch-rate')
          Write-Host "Coverage of FlatFiles: $lines% of lines ($($root.'lines-covered') of $($root.'lines-valid')), $branches% of branches ($($root.'branches-covered') of $($root.'branches-valid'))"
          if ($lines -lt 90) { throw "Line coverage is $lines%, below the 90% Conventions.md requires." }
          if ($branches -lt 90) { throw "Branch coverage is $branches%, below the 90% Conventions.md requires." }

      - name: Pack
        # Runs package validation against the baseline version named in the project file.
        run: dotnet pack FlatFiles/FlatFiles.csproj --configuration Release --no-build --output artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*nupkg
